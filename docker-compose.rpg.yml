name: rpg-game

# Isolated PostgreSQL instance for the medieval RPG rebuild of this app.
#
# This is intentionally a SEPARATE compose project/file from docker-compose.yml
# (project "football-cards"), so it never shares a network, volume, container,
# or credential set with the existing football-card app's database. The two
# stacks can run side by side on the same host without any risk of one
# touching the other's data:
#
#   football-cards_postgres_data  (existing, untouched) <- football-cards_default network
#   rpg_postgres_data             (this file)            <- rpg_network
#
# Bring up the whole stack:
#   docker compose -f docker-compose.rpg.yml --env-file .env.rpg.local up -d --build
#
# postgres/backend/bot are all wired together now. `bot` is what actually
# launches the Mini App in Telegram (a web_app inline button on /start) and
# is what rpg-backend's initData HMAC validation authenticates against —
# RPG_TELEGRAM_BOT_TOKEN must be the same bot (via @BotFather) on both
# sides. Runs in polling mode by default (no public HTTPS URL needed for
# local dev); set RPG_BOT_MODE=webhook + RPG_BOT_WEBHOOK_URL for production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RPG_DB_NAME:-rpg_game}
      POSTGRES_USER: ${RPG_DB_USER:-rpg_admin}
      POSTGRES_PASSWORD: ${RPG_DB_PASSWORD:-rpg_dev_password_change_me}
    ports:
      - "${RPG_DB_EXTERNAL_PORT:-5437}:5432"
    volumes:
      - rpg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RPG_DB_USER:-rpg_admin} -d ${RPG_DB_NAME:-rpg_game}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rpg_network

  backend:
    build:
      context: ./rpg-backend
    container_name: rpg-backend
    restart: unless-stopped
    environment:
      RPG_DATABASE_URL: postgresql+asyncpg://${RPG_DB_USER:-rpg_admin}:${RPG_DB_PASSWORD:-rpg_dev_password_change_me}@postgres:5432/${RPG_DB_NAME:-rpg_game}
      RPG_DEV_MODE: "true"
      RPG_ENVIRONMENT: development
      RPG_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      RPG_ADMIN_TELEGRAM_IDS: ${RPG_ADMIN_TELEGRAM_IDS:-999000001}
      RPG_JWT_SECRET: ${RPG_JWT_SECRET:-dev_only_secret_change_me}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./rpg-backend:/app
    ports:
      - "${RPG_BACKEND_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rpg_network

  bot:
    build:
      context: ./rpg-bot
    container_name: rpg-bot
    restart: unless-stopped
    environment:
      RPG_DATABASE_URL: postgresql+asyncpg://${RPG_DB_USER:-rpg_admin}:${RPG_DB_PASSWORD:-rpg_dev_password_change_me}@postgres:5432/${RPG_DB_NAME:-rpg_game}
      RPG_TELEGRAM_BOT_TOKEN: ${RPG_TELEGRAM_BOT_TOKEN:-0:DEV}
      RPG_TELEGRAM_BOT_USERNAME: ${RPG_TELEGRAM_BOT_USERNAME:-vardren_bot}
      RPG_ADMIN_TELEGRAM_IDS: ${RPG_ADMIN_TELEGRAM_IDS:-999000001}
      RPG_MINI_APP_URL: ${RPG_MINI_APP_URL:-http://localhost:5174}
      RPG_BOT_MODE: ${RPG_BOT_MODE:-polling}
      RPG_BOT_WEBHOOK_URL: ${RPG_BOT_WEBHOOK_URL:-}
      RPG_BOT_WEBHOOK_SECRET: ${RPG_BOT_WEBHOOK_SECRET:-dev_webhook_secret}
      RPG_TELEGRAM_PROXY_URL: ${RPG_TELEGRAM_PROXY_URL:-}
    volumes:
      - ./rpg-bot:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rpg_network

volumes:
  rpg_postgres_data:
    name: rpg_postgres_data

networks:
  rpg_network:
    name: rpg_network
